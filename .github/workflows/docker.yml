name: Build Docker Image

# One image: the Quartermaster server, for linux/amd64 and linux/arm64.
#
# The image this replaced compiled llama.cpp, whisper.cpp and
# stable-diffusion.cpp from source, once per compute backend. That was hours of
# CI per run, it needed a per-project cache-warming matrix to fit inside
# GitHub's 6h job ceiling, and it produced an appliance whose backends were
# built differently from the ones every desktop install downloads. Backends are
# now fetched at runtime from upstream's releases, the same way they are
# everywhere else, so this workflow compiles Go and npm and nothing more.
#
# Publishing on a release tag rather than on every push: the image is a
# distribution channel and it should carry the same versions the releases page
# does.

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push to ghcr.io (off = build only)"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

  # A release tag pushed BY the Release workflow does not fire the trigger
  # above: GitHub does not let events raised with the default GITHUB_TOKEN
  # start further workflow runs, or a workflow could loop itself. Releases run
  # in CI, so that trigger has been dead since they left a laptop -- v1.0.1 was
  # tagged and no image was built, which is how this was found. pages.yml hit
  # the same wall and documents it.
  #
  # workflow_run is the documented way to chain onto it. It runs at the DEFAULT
  # BRANCH ref rather than at the tag, so the tag cannot be read from the
  # context: the checkout step below resolves the newest release instead.
  workflow_run:
    workflows: [ "Release" ]
    types: [ completed ]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/quartermaster-labs/quartermaster

jobs:
  build:
    runs-on: ubuntu-latest
    # A Release that failed or was cancelled must not publish an image.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Which commit to build, and under which tags. Three ways in, and only
      # this step knows the difference:
      #
      #   push of a v* tag   the tag is the ref (a tag pushed by a human)
      #   workflow_run       the ref is the default branch, so the tag has to
      #                      be looked up: the newest published release is the
      #                      one Release just made
      #   workflow_dispatch  :edge, unless dispatched at a tag on purpose
      #
      # A release build gets :latest and :vX.Y.Z; anything else gets :edge
      # only, so a dispatch can never quietly move :latest off the last
      # release.
      - name: Work out the ref, tags and version
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=""
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            tag=$(gh release view -R "${GITHUB_REPOSITORY}" --json tagName -q .tagName)
            if [[ -z "${tag}" ]]; then
              echo "Release finished but no published release was found" >&2
              exit 1
            fi
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          fi

          if [[ -n "${tag}" ]]; then
            ref="${tag}"
            version="${tag}"
            tags="${IMAGE}:${version},${IMAGE}:latest"
          else
            ref="${GITHUB_SHA}"
            # Not "local_": this is a CI image anyone can pull, and calling it
            # a local build is a lie the dashboard then repeats. Still
            # unparseable as semver, which is what keeps internal/update from
            # polling for a release it could not apply anyway.
            version="edge_${GITHUB_SHA::12}"
            tags="${IMAGE}:edge"
          fi

          {
            echo "ref=${ref}"
            echo "version=${version}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ steps.meta.outputs.ref }}

      # linux/arm64 is a cross-compile, not an emulated build: both build
      # stages are pinned to $BUILDPLATFORM and only the runtime layers are
      # per-arch, so there is no QEMU step here on purpose.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            QM_VERSION=${{ steps.meta.outputs.version }}
            QM_COMMIT=${{ github.sha }}
          # GitHub Actions cache, not a registry cache: the layers worth
          # keeping here are the npm and Go module downloads, which are small
          # enough that the 10 GB Actions cache holds them comfortably.
          cache-from: type=gha
          cache-to: type=gha,mode=max
