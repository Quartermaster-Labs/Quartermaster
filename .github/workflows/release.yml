name: goreleaser

on:
  # Driven by `make release` / `make release-public` (which push the tag, then
  # dispatch this). No push-tags trigger, so a tag push alone won't double-build.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag version to release (e.g. v144)"
        required: true
      draft:
        description: "Keep the release as a draft (true) or publish it (false)"
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #6.4.0
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
        with:
          node-version: "24"
      - name: Build UI
        run: |
          make ui

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 #7.2.1
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-installer:
    runs-on: windows-latest
    needs: goreleaser
    permissions:
      contents: write
    # `secrets` can't be used in `if:`; expose it as env so steps can gate on it.
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #6.4.0
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
        with:
          node-version: "24"

      - name: Build UI
        working-directory: ui-svelte
        run: |
          npm ci
          npm run build

      - name: Build binary + stage bundle
        shell: pwsh
        run: |
          $tag    = "${{ github.event.inputs.tag || github.ref_name }}"
          $commit = (git rev-parse --short HEAD).Trim()
          $date   = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          New-Item -ItemType Directory -Force staging | Out-Null
          go build -ldflags "-X main.commit=$commit -X main.version=$tag -X main.date=$date" `
            -o staging\llama-quartermaster-windows-amd64.exe .
          Copy-Item config.example.yaml,quartermaster-generate.example.yaml,LICENSE.md,README.md staging\
          Copy-Item packaging\windows\start.cmd staging\start.cmd
          Copy-Item -Recurse packaging staging\packaging
          "llama-quartermaster $tag built $date" | Out-File -Encoding utf8 staging\VERSION.txt

      - name: Sign binary (optional)
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: '& packaging\windows\sign.ps1 staging\llama-quartermaster-windows-amd64.exe'

      - name: Compile installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $tag     = "${{ github.event.inputs.tag || github.ref_name }}"
          $staging = (Resolve-Path staging).Path
          $outdir  = Join-Path $PWD "Output"
          $iscc    = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$tag" "/DStagingDir=$staging" "/DOutputDir=$outdir" packaging\windows\installer.iss

      - name: Sign installer (optional)
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: '& packaging\windows\sign.ps1 (Resolve-Path Output\*.exe)'

      - name: Upload installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload $tag (Resolve-Path Output\*.exe) --clobber

      - name: Publish release
        if: ${{ github.event.inputs.draft == 'false' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.event.inputs.tag }}" --draft=false
