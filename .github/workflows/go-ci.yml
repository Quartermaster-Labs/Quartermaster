name: Linux CI

# Deliberately unfiltered. This used to list the paths that "affect the backend"
# (Go files, go.mod, the Makefile, and config-schema.json / config.example.yaml
# because TestConfig_ExampleMatchesSchema validates one against the other). The
# list was always a guess at which files can break a build, and the guess was
# wrong: a .gitignore edit silently swallowed internal/server/ui_dist's embed
# placeholder, so the whole server package stopped compiling on a fresh clone and
# no run was triggered to say so. The badge in README reports this workflow as
# the state of main, which is only true if every push to main actually runs it.
#
# The filters were worth having when Actions minutes were metered on a private
# repo. They are free now, and a few minutes of runner time on a docs-only commit
# is a much better trade than a class of change CI cannot see.
on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  # Allows manual triggering of the workflow
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #6.4.0
        with:
          go-version-file: go.mod

      # Only run in this linux based runner
      - name: Check Formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            gofmt -l .
            exit 1
          fi
      # `make test-all` is `go test ./internal/...`, so without this nothing in CI
      # ever compiles the binaries that actually ship. cmd/quartermaster (with
      # bundle.go) and the whole cmd/quartermaster-setup wizard could fail to
      # build and this job would still be green: the breakage would surface from
      # `make release`, after the tag naming that commit already exists. The old
      # path filters said the quiet part out loud, excluding cmd/ "because it
      # contains utilities without tests" — true of the tests, not of the build.
      #
      # CGO is off across the project, so this one Linux runner covers every
      # target the release publishes, Windows and macOS included.
      - name: Build the shipped commands for every release target
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/arm64; do
            echo "== $target"
            GOOS="${target%/*}" GOARCH="${target#*/}"               go build -o /dev/null ./cmd/quartermaster ./cmd/quartermaster-setup
          done

      # cache simple-responder to save the build time
      - name: Restore Simple Responder
        id: restore-simple-responder
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: ./build
          key: ${{ runner.os }}-simple-responder-${{ hashFiles('cmd/simple-responder/simple-responder.go') }}

      # necessary for testing proxy/Process swapping
      - name: Create simple-responder
        if: steps.restore-simple-responder.outputs.cache-hit != 'true'
        run: make simple-responder

      - name: Save Simple Responder
        # nothing new to save ... skip this step
        if: steps.restore-simple-responder.outputs.cache-hit != 'true'
        id: save-simple-responder
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: ./build
          key: ${{ runner.os }}-simple-responder-${{ hashFiles('cmd/simple-responder/simple-responder.go') }}

      - name: Test all
        run: make test-all
