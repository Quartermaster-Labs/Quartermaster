name: Build Unified Docker Image

on:
  # ponytail: cron removed — daily 2-backend source-compile burned ~400 CI min/day.
  # Build on demand instead. Re-add `schedule:` if you need nightly images.
  workflow_dispatch:
    inputs:
      llama_cpp_ref:
        description: "llama.cpp commit hash, tag, or branch"
        required: false
        default: "master"
      whisper_ref:
        description: "whisper.cpp commit hash, tag, or branch"
        required: false
        default: "master"
      sd_ref:
        description: "stable-diffusion.cpp commit hash, tag, or branch"
        required: false
        default: "master"
      ik_llama_ref:
        description: "ik_llama.cpp commit hash, tag, or branch (CUDA only)"
        required: false
        default: "main"
      build_cuda:
        description: "Build CUDA image"
        type: boolean
        required: false
        default: true
      build_vulkan:
        description: "Build Vulkan image"
        type: boolean
        required: false
        default: true
      push_to_ghcr:
        description: "Push images to ghcr.io"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      llama_hash: ${{ steps.refs.outputs.llama_hash }}
      whisper_hash: ${{ steps.refs.outputs.whisper_hash }}
      sd_hash: ${{ steps.refs.outputs.sd_hash }}
      ik_llama_hash: ${{ steps.refs.outputs.ik_llama_hash }}
    steps:
      # Resolve every upstream ref ONCE, here, and hand the commits to every
      # job below. Each job resolving "master" for itself would pick up whatever
      # upstream had pushed in the meantime, so the cache-warming jobs and the
      # assembly job would compile different source and share nothing.
      - id: refs
        run: |
          resolve() {
            local url="$1" ref="$2" hash
            hash=$(git ls-remote "$url" "refs/tags/$ref" "refs/heads/$ref" | head -1 | cut -f1)
            if [[ -z "$hash" ]]; then
              hash=$(git ls-remote "$url" HEAD | head -1 | cut -f1)
            fi
            if [[ -z "$hash" ]]; then
              echo "ERROR: could not resolve '$ref' in $url" >&2
              return 1
            fi
            echo "$hash"
          }
          {
            echo "llama_hash=$(resolve https://github.com/ggml-org/llama.cpp.git "${{ inputs.llama_cpp_ref || 'master' }}")"
            echo "whisper_hash=$(resolve https://github.com/ggml-org/whisper.cpp.git "${{ inputs.whisper_ref || 'master' }}")"
            echo "sd_hash=$(resolve https://github.com/leejet/stable-diffusion.cpp.git "${{ inputs.sd_ref || 'master' }}")"
            echo "ik_llama_hash=$(resolve https://github.com/ikawrakow/ik_llama.cpp.git "${{ inputs.ik_llama_ref || 'main' }}")"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - id: set-matrix
        run: |
          backends=()
          # schedule uses defaults (build both); workflow_dispatch respects inputs
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ inputs.build_cuda }}" == "true" ]]; then
            backends+=("cuda")
          fi
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ inputs.build_vulkan }}" == "true" ]]; then
            backends+=("vulkan")
          fi
          matrix=$(printf '%s\n' "${backends[@]}" | jq -R . | jq -sc .)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  # One job per project, so no single job has to fit the whole compile into
  # GitHub's hard 6h ceiling, which is what cancelled the CUDA build. Each job
  # builds one stage and exports its layers to a registry cache; the assembly
  # job below then finds everything already compiled. They also run in parallel,
  # so the wall-clock cost is the slowest project rather than the sum.
  warm:
    needs: setup
    if: ${{ needs.setup.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.setup.outputs.matrix) }}
        stage: [whisper-build, sd-build, llama-build, ik-llama-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          df -h

      - name: Set up Docker Buildx
        if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd #v4.0.0

      - name: Log in to GitHub Container Registry
        if: ${{ !env.ACT }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Warm ${{ matrix.stage }} cache (${{ matrix.backend }})
        env:
          BUILD_TARGET: ${{ matrix.stage }}
          # Two, not nproc: see the BUILD_JOBS note in the Dockerfile.
          BUILD_JOBS: 2
          LLAMA_HASH: ${{ needs.setup.outputs.llama_hash }}
          WHISPER_HASH: ${{ needs.setup.outputs.whisper_hash }}
          SD_HASH: ${{ needs.setup.outputs.sd_hash }}
          IK_LLAMA_HASH: ${{ needs.setup.outputs.ik_llama_hash }}
        run: |
          chmod +x docker/unified/build-image.sh
          docker/unified/build-image.sh --${{ matrix.backend }}

  build:
    needs: [setup, warm]
    if: ${{ needs.setup.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          echo "After cleanup:"
          df -h

      # On GitHub Actions runners, create a fresh builder.
      # When running locally under act, skip this and reuse the existing
      # quartermaster-builder (which has ccache warm) to avoid exhausting disk.
      - name: Set up Docker Buildx
        if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd #v4.0.0

      - name: Log in to GitHub Container Registry
        if: ${{ !env.ACT }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build unified Docker image (${{ matrix.backend }})
        env:
          # The commits the warm jobs compiled, not the refs they were named by.
          # Resolving again here could land on a newer upstream commit and throw
          # away every stage cache this run just paid for.
          LLAMA_HASH: ${{ needs.setup.outputs.llama_hash }}
          WHISPER_HASH: ${{ needs.setup.outputs.whisper_hash }}
          SD_HASH: ${{ needs.setup.outputs.sd_hash }}
          IK_LLAMA_HASH: ${{ needs.setup.outputs.ik_llama_hash }}
          BUILD_JOBS: 2
          DOCKER_IMAGE_TAG: ghcr.io/quartermaster-labs/quartermaster:unified-${{ matrix.backend }}
          # When running under act, use the local builder that has warm ccache.
          # On GitHub Actions, BUILDX_BUILDER is unset so docker uses the builder
          # created by setup-buildx-action above.
          BUILDX_BUILDER: ${{ env.ACT == 'true' && 'quartermaster-builder' || '' }}
        run: |
          chmod +x docker/unified/build-image.sh
          docker/unified/build-image.sh --${{ matrix.backend }}

      - name: Push to GitHub Container Registry
        if: ${{ !env.ACT && (github.event_name == 'schedule' || inputs.push_to_ghcr == true) }}
        run: |
          BASE_TAG="ghcr.io/quartermaster-labs/quartermaster:unified-${{ matrix.backend }}"
          DATE_TAG=$(date -u +%Y-%m-%d)

          docker push "${BASE_TAG}"
          docker tag "${BASE_TAG}" "${BASE_TAG}-${DATE_TAG}"
          docker push "${BASE_TAG}-${DATE_TAG}"

          ROOTLESS_TAG="${BASE_TAG}-rootless"
          docker push "${ROOTLESS_TAG}"
          docker tag "${ROOTLESS_TAG}" "${ROOTLESS_TAG}-${DATE_TAG}"
          docker push "${ROOTLESS_TAG}-${DATE_TAG}"
