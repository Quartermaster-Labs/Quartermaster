<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Quartermaster</title>
    <script>
      // Resolve the theme BEFORE the first paint. The Svelte app sets
      // data-theme in an effect after mount, and index.css defines the light
      // palette on bare :root -- so without this the document paints parchment
      // (or plain UA white) for a frame or two on the way to dark. In the app
      // window the playground is an <iframe> opened on its own port, where that
      // flash is a full-window white flash with no browser chrome to explain it.
      //
      // Mirrors stores/theme.ts: persisted "theme-mode" is JSON, "system"
      // follows the OS, and a missing value means system.
      (function () {
        var mode = "system";
        try {
          var saved = localStorage.getItem("theme-mode");
          if (saved !== null) mode = JSON.parse(saved);
          // Pre-migration key, still honoured by getInitialThemeMode().
          else {
            var legacy = localStorage.getItem("theme");
            if (legacy !== null) mode = JSON.parse(legacy) ? "dark" : "light";
          }
        } catch (e) {}
        var dark =
          mode === "dark" ||
          (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <style>
      /* Paints the canvas correctly even before the bundled CSS lands: these are
         --color-background from index.css, inlined because the variables it
         defines are not available yet. color-scheme also stops the UA painting
         a white canvas and light scrollbars around a dark page. */
      :root[data-theme="dark"] {
        background: #22201e;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        background: #f0e6d6;
        color-scheme: light;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
